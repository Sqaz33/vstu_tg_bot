services:
  bot:
    build: .
    restart: unless-stopped
    init: true
    environment:
      BOT_TOKEN: ${BOT_TOKEN:?Set BOT_TOKEN in the shell environment}
      DATABASE_PATH: /app/data/schedule.db
      SOURCE_PAGE_URL: https://www.vstu.ru/student/raspisaniya/zanyatiy/index.php?dep=mag
      SOURCE_FILE_PATTERN: 1 курс ФЭВТ.xls
      UPDATE_INTERVAL_SECONDS: 300
      TIMEZONE: Europe/Moscow
      LOG_FORMAT: json
      HEALTH_HOST: 0.0.0.0
      HEALTH_PORT: 8080
    volumes:
      - schedule-data:/app/data
    ports:
      - "127.0.0.1:8080:8080"
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 0.50

volumes:
  schedule-data:
